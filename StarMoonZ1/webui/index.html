<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarMoon-z1 · Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/marked.min.js" integrity="sha512-gxBP/mcwo9A5lJDFbVfXNb1hSLpOkHLLXAjld8HfCWjVIZnA3nlNnIqSTLvtwF4t55Dt4Rzh7phL3tJuKZ+teQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" integrity="sha512-EBLzUL8XLl+va/zAsmXwS7Z2B1F9HUHkZwyS/VKwh3S7T/U0nF4BaU29EP/ZSf6zgiIxYAnKLu6bJ8dqpmX5uw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  /* ===== 深色 · 午夜天文台 ===== */
  --bg-0:#070a11; --bg-1:#0f131c; --bg-2:#141a26; --bg-3:#1b2230; --bg-4:#232c3d;
  --glass:rgba(18,24,36,.62); --glass-2:rgba(22,28,42,.42);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.13); --line-3:rgba(255,255,255,.22);
  --tx-0:#eef2f8; --tx-1:#c4ccda; --tx-2:#8a94a6; --tx-3:#5c6679;
  --jade:#19c3b1; --jade-2:#2ee6d2; --jade-dim:rgba(25,195,177,.13);
  --coral:#ff8a7a; --green:#34d399; --blue:#60a5fa; --violet:#a78bfa; --red:#f87171; --amber:#fbbf24;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --side-w:284px;
  --blur:blur(22px) saturate(1.4);
  --radius:16px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg-0);color:var(--tx-1);overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(25,195,177,.28);color:#fff}
button{font-family:inherit}
a{color:inherit}

/* ===== 环境: 星空 + 星云 ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(1200px 820px at 12% -12%, #18223c 0%, transparent 55%),
  radial-gradient(1000px 720px at 112% 18%, #15303a 0%, transparent 52%),
  linear-gradient(180deg,#06080e 0%,#0a0e16 50%,#06080e 100%);}
.bg-stars{position:absolute;inset:-60%;background-image:
  radial-gradient(1.5px 1.5px at 26px 36px,#ffffff,transparent),
  radial-gradient(1.2px 1.2px at 132px 84px,#dbe6ff,transparent),
  radial-gradient(1px 1px at 224px 162px,#ffffff,transparent),
  radial-gradient(1.7px 1.7px at 306px 64px,#cfe9ff,transparent),
  radial-gradient(1px 1px at 86px 206px,#ffffff,transparent),
  radial-gradient(1.3px 1.3px at 176px 280px,#eaf2ff,transparent);
  background-size:360px 360px;opacity:.55;animation:starDrift 140s linear infinite;will-change:transform}
@keyframes starDrift{to{transform:translate(360px,360px)}}
.bg-neb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55;mix-blend-mode:screen;pointer-events:none}
.bg-neb.n1{width:540px;height:540px;left:-140px;top:-180px;background:radial-gradient(circle,rgba(25,195,177,.26),transparent 62%);animation:float1 26s ease-in-out infinite alternate}
.bg-neb.n2{width:640px;height:640px;right:-200px;bottom:-240px;background:radial-gradient(circle,rgba(167,139,250,.18),transparent 62%);animation:float2 32s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(60px,46px) scale(1.08)}}
@keyframes float2{to{transform:translate(-54px,-40px) scale(1.06)}}

.app{display:flex;height:100vh;position:relative;z-index:1}

/* ============ 侧边栏 ============ */
.sidebar{width:var(--side-w);min-width:var(--side-w);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .34s var(--ease),transform .34s var(--ease)}
.app.side-collapsed .sidebar{margin-left:calc(-1 * var(--side-w))}
.side-top{padding:18px 14px 12px}
.brand-row{display:flex;align-items:center;gap:11px;padding:2px 6px 14px}
.logo{width:34px;height:34px;min-width:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--jade),#0c8a7c);box-shadow:0 4px 16px rgba(25,195,177,.4),inset 0 1px 0 rgba(255,255,255,.25);position:relative;overflow:hidden}
.logo::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 32%,rgba(255,255,255,.55) 50%,transparent 68%);transform:translateX(-130%);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,58%{transform:translateX(-130%)}86%,100%{transform:translateX(130%)}}
.logo svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.brand-name{font-family:var(--disp);font-size:15.5px;font-weight:700;color:var(--tx-0);letter-spacing:.3px}
.brand-name b{color:var(--jade-2)}
.icon-btn{background:none;border:none;color:var(--tx-3);width:30px;height:30px;border-radius:8px;cursor:pointer;display:grid;place-items:center;transition:all .18s;font-size:15px}
.icon-btn:hover{background:var(--bg-3);color:var(--tx-0)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.brand-row .icon-btn{margin-left:auto}
.newchat{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;background:linear-gradient(180deg,rgba(25,195,177,.14),rgba(25,195,177,.06));border:1px solid rgba(25,195,177,.28);border-radius:11px;color:var(--tx-0);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s var(--ease)}
.newchat:hover{border-color:rgba(25,195,177,.55);box-shadow:0 6px 20px rgba(25,195,177,.18);transform:translateY(-1px)}
.newchat .nc-ico{width:26px;height:26px;min-width:26px;border-radius:8px;background:linear-gradient(145deg,var(--jade),#0c8a7c);display:grid;place-items:center;color:#fff;font-size:17px;font-weight:600;transition:transform .25s var(--ease)}
.newchat:hover .nc-ico{transform:rotate(90deg)}

.conv-list{flex:1;overflow-y:auto;padding:6px 12px 12px}
.conv-list::-webkit-scrollbar{width:5px}
.conv-list::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.cg-label{font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--tx-3);padding:16px 10px 7px;text-transform:uppercase;font-family:var(--disp)}
.conv-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--tx-1);font-size:13px;transition:background .15s,color .15s;position:relative;user-select:none}
.conv-item:hover{background:var(--bg-3)}
.conv-item.active{background:var(--bg-3);color:var(--tx-0)}
.conv-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:linear-gradient(var(--jade),var(--jade-2));box-shadow:0 0 8px rgba(25,195,177,.6)}
.ci-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-del{display:none;background:none;border:none;color:var(--tx-3);cursor:pointer;width:22px;height:22px;border-radius:5px;place-items:center;font-size:12px;transition:all .15s}
.conv-item:hover .ci-del{display:grid}
.ci-del:hover{background:rgba(248,113,113,.16);color:var(--red)}
.conv-empty{padding:30px 14px;text-align:center;color:var(--tx-3);font-size:12px;line-height:1.8}

/* 侧边栏底部: 参数折叠 + 状态 */
.side-bottom{border-top:1px solid var(--line);padding:10px 13px 13px}
.acc-head{display:flex;align-items:center;gap:9px;width:100%;padding:9px 9px;background:none;border:none;border-radius:9px;color:var(--tx-1);font-size:13px;cursor:pointer;transition:background .15s}
.acc-head:hover{background:var(--bg-3)}
.acc-head .acc-ico{color:var(--jade);font-size:14px}
.acc-head .chev{margin-left:auto;color:var(--tx-3);transition:transform .25s var(--ease);font-size:11px}
.acc-head.open .chev{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .38s var(--ease)}
.acc-body.open{max-height:560px}
.acc-inner{padding:12px 6px 4px}
.ctrl{margin-bottom:15px}
.ctrl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ctrl-name{font-size:12px;color:var(--tx-2)}
.ctrl-val{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--jade-2);background:var(--jade-dim);padding:2px 8px;border-radius:6px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--jade) var(--fill,50%),var(--bg-4) var(--fill,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--bg-1);border:3px solid var(--jade);box-shadow:0 0 0 3px rgba(25,195,177,.18),0 2px 6px rgba(0,0,0,.4);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
.ctrl textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;color:var(--tx-1);font-family:var(--body);font-size:12px;line-height:1.55;padding:10px 11px;resize:vertical;min-height:62px;outline:none;transition:border-color .2s,box-shadow .2s}
.ctrl textarea:focus{border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-dim)}
.status-row{display:flex;align-items:center;gap:9px;padding:11px 9px 2px;font-family:var(--mono);font-size:10.5px;color:var(--tx-3)}
.pulse{width:7px;height:7px;min-width:7px;border-radius:50%;background:var(--tx-3);position:relative}
.pulse.on{background:var(--green)}
.pulse.on::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--green);animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2);opacity:0}}
.pulse.off{background:var(--red)}
.st-model{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx-2)}
.st-badge{font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--jade-dim);color:var(--jade-2);border:1px solid rgba(25,195,177,.3)}

/* ============ 主区 ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(10,14,22,.4),transparent)}
.menu-btn{display:none}
.model-wrap{position:relative}
.model-sel{display:flex;align-items:center;gap:10px;background:none;border:none;border-radius:10px;padding:8px 13px;cursor:pointer;transition:background .18s}
.model-sel:hover{background:var(--bg-3)}
.ms-name{font-family:var(--disp);font-size:16px;font-weight:600;color:var(--tx-0)}
.ms-sub{font-size:12px;color:var(--tx-3);font-weight:500}
.model-sel .chev{color:var(--tx-3);font-size:10px;transition:transform .2s}
.model-sel:hover .chev{color:var(--tx-1)}
.model-pop{position:absolute;top:calc(100% + 8px);left:0;width:268px;background:rgba(15,19,28,.92);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-2);border-radius:14px;padding:14px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .22s var(--ease);text-align:left;cursor:default}
.model-pop.show{opacity:1;transform:translateY(0);pointer-events:auto}
.mp-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.mp-row:last-child{border-bottom:none}
.mp-k{color:var(--tx-3)}
.mp-v{font-family:var(--mono);font-size:11px;color:var(--tx-0)}
.mp-v.ok{color:var(--green)} .mp-v.warn{color:var(--red)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-stats{display:flex;gap:16px;font-family:var(--mono);font-size:10.5px;color:var(--tx-3)}
.top-stats b{color:var(--jade-2);font-weight:700}
@media(max-width:900px){.top-stats{display:none}}

/* ============ 对话滚动区 ============ */
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.chat-scroll::-webkit-scrollbar{width:8px}
.chat-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.chat-scroll::-webkit-scrollbar-thumb:hover{background:var(--line-3)}

/* 空状态 */
.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 64px;animation:fadeUp .6s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.e-mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--jade),#0c8a7c);box-shadow:0 10px 34px rgba(25,195,177,.42),inset 0 1px 0 rgba(255,255,255,.25);margin-bottom:24px;position:relative;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 10px 34px rgba(25,195,177,.42)}50%{transform:scale(1.06);box-shadow:0 14px 44px rgba(25,195,177,.58)}}
.e-mark svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.e-kicker{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--jade-2);margin-bottom:14px;text-transform:uppercase}
.e-greet{font-family:var(--disp);font-size:clamp(27px,3.7vw,36px);font-weight:600;color:var(--tx-0);letter-spacing:-.6px;margin-bottom:8px;text-align:center}
.e-sub{font-size:14px;color:var(--tx-2);margin-bottom:30px;text-align:center;max-width:520px;line-height:1.6}
.e-slot{width:100%;max-width:720px}
.qp{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px;max-width:720px}
.chip{display:inline-flex;align-items:center;gap:9px;background:var(--glass-2);border:1px solid var(--line);border-radius:14px;padding:11px 16px;cursor:pointer;font-size:12.5px;color:var(--tx-1);transition:all .22s var(--ease);backdrop-filter:var(--blur)}
.chip .dot{width:7px;height:7px;min-width:7px;border-radius:50%}
.chip:hover{transform:translateY(-3px);border-color:var(--line-3);background:var(--bg-3);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.chip.c1 .dot{background:var(--jade);box-shadow:0 0 9px var(--jade)}
.chip.c2 .dot{background:var(--violet);box-shadow:0 0 9px var(--violet)}
.chip.c3 .dot{background:var(--blue);box-shadow:0 0 9px var(--blue)}
.chip.c4 .dot{background:var(--coral);box-shadow:0 0 9px var(--coral)}

/* 消息流 */
.thread{max-width:800px;margin:0 auto;padding:30px 24px 12px}
.u-row{display:flex;justify-content:flex-end;margin-bottom:26px;animation:fadeUp .35s var(--ease) both}
.u-bubble{max-width:78%;background:linear-gradient(180deg,rgba(25,195,177,.16),rgba(25,195,177,.09));border:1px solid rgba(25,195,177,.32);color:var(--tx-0);padding:12px 18px;border-radius:20px 20px 6px 20px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.a-row{display:flex;gap:15px;margin-bottom:32px;animation:fadeUp .4s var(--ease) both}
.a-ava{width:32px;height:32px;min-width:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:linear-gradient(145deg,var(--jade),#0c8a7c);margin-top:2px;position:relative;box-shadow:0 4px 14px rgba(25,195,177,.32)}
.a-row.gen .a-ava::after{content:'';position:absolute;inset:-4px;border-radius:13px;border:1.5px solid rgba(25,195,177,.55);animation:ring 1.5s ease-out infinite}
.a-body{flex:1;min-width:0}
.a-content{font-size:14.5px;line-height:1.8;color:var(--tx-1);word-break:break-word}
.a-actions{display:flex;gap:2px;margin-top:10px;opacity:0;transition:opacity .25s}
.a-row:hover .a-actions,.a-row:focus-within .a-actions{opacity:1}
@media(hover:none){.a-actions{opacity:1}}
.act{background:none;border:none;color:var(--tx-3);width:28px;height:28px;border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:all .15s}
.act:hover{background:var(--bg-3);color:var(--jade-2)}
.act svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Markdown */
.a-content p{margin-bottom:11px}.a-content p:last-child{margin-bottom:0}
.a-content ul,.a-content ol{padding-left:23px;margin-bottom:11px}
.a-content li{margin-bottom:5px}
.a-content li::marker{color:var(--jade)}
.a-content strong{color:var(--tx-0);font-weight:600}
.a-content em{color:var(--violet)}
.a-content a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(96,165,250,.35)}
.a-content a:hover{border-bottom-color:var(--blue)}
.a-content h1,.a-content h2,.a-content h3{font-family:var(--disp);color:var(--tx-0);margin:18px 0 10px;line-height:1.3}
.a-content h1{font-size:19px}.a-content h2{font-size:16.5px}.a-content h3{font-size:15px}
.a-content blockquote{border-left:3px solid var(--jade);padding:9px 16px;margin:12px 0;background:var(--jade-dim);border-radius:0 10px 10px 0;color:var(--tx-2)}
.a-content hr{border:none;height:1px;background:var(--line);margin:16px 0}
.a-content code:not(pre code){font-family:var(--mono);font-size:12.5px;background:var(--bg-3);border:1px solid var(--line-2);padding:2px 7px;border-radius:6px;color:var(--jade-2)}
.a-content table{border-collapse:collapse;margin:13px 0;font-size:13px;width:100%}
.a-content th,.a-content td{border:1px solid var(--line);padding:8px 13px;text-align:left}
.a-content th{background:var(--bg-3);font-family:var(--disp);font-weight:600;color:var(--tx-0);font-size:12.5px}
.a-content tr:nth-child(even) td{background:rgba(255,255,255,.02)}

/* 代码块 */
.codeblock{margin:14px 0;border-radius:13px;overflow:hidden;border:1px solid var(--line-2);background:#0a0d14;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.cb-head{display:flex;align-items:center;gap:9px;padding:9px 14px;background:#11151f;border-bottom:1px solid var(--line)}
.cb-dots{display:flex;gap:6px}
.cb-dots i{width:10px;height:10px;border-radius:50%}
.cb-dots i:nth-child(1){background:#f07068}.cb-dots i:nth-child(2){background:#f0b449}.cb-dots i:nth-child(3){background:#5fd68f}
.cb-lang{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8b949e}
.cb-copy{margin-left:auto;background:none;border:1px solid #2a313d;color:#8b949e;font-family:var(--mono);font-size:10px;padding:3px 11px;border-radius:6px;cursor:pointer;transition:all .2s}
.cb-copy:hover{border-color:var(--jade-2);color:var(--jade-2)}
.codeblock pre{margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7}
.codeblock pre::-webkit-scrollbar{height:5px}
.codeblock pre::-webkit-scrollbar-thumb{background:#2a313d;border-radius:3px}
.hljs{color:#c9d1d9}
.hljs-keyword,.hljs-selector-tag{color:#ff7b72}
.hljs-string{color:#a5d6ff}
.hljs-number,.hljs-literal{color:#79c0ff}
.hljs-comment{color:#8b949e;font-style:italic}
.hljs-title.function_,.hljs-function .hljs-title{color:#d2a8ff}
.hljs-built_in{color:#ffa657}
.hljs-type,.hljs-class .hljs-title{color:#f0c674}
.hljs-attr,.hljs-attribute{color:#79c0ff}
.hljs-meta{color:#8b949e}

.cursor{display:inline-block;width:8px;height:17px;background:var(--jade-2);margin-left:3px;vertical-align:text-bottom;border-radius:2px;animation:blink .75s steps(2) infinite;box-shadow:0 0 10px rgba(25,195,177,.5)}
@keyframes blink{50%{opacity:0}}
.thinking{display:inline-flex;gap:5px;padding:9px 0}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--jade-2);opacity:.25;animation:think 1.15s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.14s}.thinking i:nth-child(3){animation-delay:.28s}
@keyframes think{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}

/* ============ 输入框 ============ */
.composer{width:100%;max-width:720px;margin:0 auto}
.cbox{background:rgba(20,26,40,.7);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-2);border-radius:26px;padding:11px 12px 11px 18px;display:flex;align-items:flex-end;gap:10px;transition:border-color .25s,box-shadow .25s;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.cbox:focus-within{border-color:rgba(25,195,177,.55);box-shadow:0 0 0 4px var(--jade-dim),0 14px 42px rgba(0,0,0,.45)}
.cbox textarea{flex:1;background:none;border:none;outline:none;color:var(--tx-0);font-family:var(--body);font-size:14.5px;line-height:1.55;resize:none;max-height:200px;min-height:24px;padding:5px 0}
.cbox textarea::placeholder{color:var(--tx-3)}
.send{width:40px;height:40px;min-width:40px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;background:var(--bg-4);color:var(--tx-3);transition:all .22s var(--ease)}
.send svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.send.ready{background:linear-gradient(145deg,var(--jade),#0c8a7c);color:#fff;box-shadow:0 6px 20px rgba(25,195,177,.45)}
.send.ready:hover{transform:scale(1.08);box-shadow:0 8px 26px rgba(25,195,177,.6)}
.send:active{transform:scale(.92)}
.send.stop{background:linear-gradient(145deg,var(--red),#c93b3b);color:#fff;box-shadow:0 6px 20px rgba(248,113,113,.4)}
.composer-dock{padding:10px 24px 18px;flex-shrink:0;background:linear-gradient(to top,rgba(7,10,17,.92) 55%,transparent)}
.dock-hint{text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--tx-3);margin-top:10px;letter-spacing:.4px}
.dock-hint kbd{background:var(--bg-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:8.5px;color:var(--tx-2)}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,80px);z-index:200;background:rgba(18,24,36,.95);border:1px solid var(--line-3);color:var(--tx-0);font-size:12.5px;padding:11px 20px;border-radius:13px;box-shadow:var(--shadow);opacity:0;transition:all .35s var(--ease);pointer-events:none;display:flex;align-items:center;gap:9px;backdrop-filter:var(--blur)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .tdot{width:7px;height:7px;border-radius:50%;background:var(--green)}

.overlay{display:none;position:fixed;inset:0;z-index:99;background:rgba(4,6,11,.55);backdrop-filter:blur(3px)}
.overlay.show{display:block}
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-105%);box-shadow:14px 0 46px rgba(0,0,0,.5);margin-left:0!important}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:grid}
  .u-bubble{max-width:88%}
  .thread{padding:22px 15px 12px}
  .composer-dock{padding:10px 15px 14px}
}
</style>
</head>
<body>
<div class="bg">
  <div class="bg-stars"></div>
  <div class="bg-neb n1"></div>
  <div class="bg-neb n2"></div>
</div>

<div class="app" id="app">
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand-row">
        <div class="logo"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/><path d="M18.5 4.5l.9 1.9 1.9.9-1.9.9-.9 1.9-.9-1.9-1.9-.9 1.9-.9z"/></svg></div>
        <span class="brand-name">STARMOON<b>·Z1</b></span>
        <button class="icon-btn" id="collapseBtn" title="收起侧边栏"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      </div>
      <button class="newchat" id="newBtn"><span class="nc-ico">＋</span>新对话</button>
    </div>

    <div class="conv-list" id="convList"></div>

    <div class="side-bottom">
      <button class="acc-head" id="accHead"><span class="acc-ico">⚙</span> 生成参数 <span class="chev">▾</span></button>
      <div class="acc-body" id="accBody">
        <div class="acc-inner">
          <div class="ctrl"><div class="ctrl-top"><span class="ctrl-name">Temperature</span><span class="ctrl-val" id="tempVal">0.70</span></div><input type="range" id="temperature" min="0" max="2" step="0.05" value="0.7"></div>
          <div class="ctrl"><div class="ctrl-top"><span class="ctrl-name">Top-P</span><span class="ctrl-val" id="topPVal">0.90</span></div><input type="range" id="topP" min="0.1" max="1" step="0.05" value="0.9"></div>
          <div class="ctrl"><div class="ctrl-top"><span class="ctrl-name">Top-K</span><span class="ctrl-val" id="topKVal">50</span></div><input type="range" id="topK" min="0" max="200" step="1" value="50"></div>
          <div class="ctrl"><div class="ctrl-top"><span class="ctrl-name">Repetition Penalty</span><span class="ctrl-val" id="repPVal">1.00</span></div><input type="range" id="repP" min="0.5" max="3" step="0.05" value="1.0"></div>
          <div class="ctrl"><div class="ctrl-top"><span class="ctrl-name">Max Tokens</span><span class="ctrl-val" id="maxTokVal">2048</span></div><input type="range" id="maxTokens" min="128" max="8192" step="128" value="2048"></div>
          <div class="ctrl"><textarea id="systemPrompt">你是 StarMoon-z1，一个擅长代码生成、数学推理和文本创作的 AI 助手。回答简洁、准确，代码附带注释。</textarea></div>
        </div>
      </div>
      <div class="status-row">
        <span class="pulse" id="statusDot"></span>
        <span class="st-model" id="modelName">connecting…</span>
        <span class="st-badge" id="backendBadge">—</span>
      </div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- ===== 主区 ===== -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="打开侧边栏"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="model-wrap">
        <button class="model-sel" id="modelSel">
          <span class="ms-name">StarMoon-z1</span>
          <span class="ms-sub" id="msSub">1.5B · Instruct</span>
          <span class="chev">▾</span>
        </button>
        <div class="model-pop" id="modelPop">
          <div class="mp-row"><span class="mp-k">模型</span><span class="mp-v" id="mpModel">—</span></div>
          <div class="mp-row"><span class="mp-k">推理后端</span><span class="mp-v" id="mpBackend">—</span></div>
          <div class="mp-row"><span class="mp-k">服务状态</span><span class="mp-v" id="mpStatus">—</span></div>
          <div class="mp-row"><span class="mp-k">流式协议</span><span class="mp-v">SSE</span></div>
        </div>
      </div>
      <div class="top-right">
        <div class="top-stats"><span>tok <b id="statTokens">0</b></span><span>speed <b id="statSpeed">—</b>/s</span></div>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="empty" id="emptyState">
        <div class="e-mark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/><path d="M18.5 4.5l.9 1.9 1.9.9-1.9.9-.9 1.9-.9-1.9-1.9-.9 1.9-.9z"/></svg></div>
        <div class="e-kicker">Code · Reasoning · Generation</div>
        <h1 class="e-greet">你好，我是 StarMoon-z1</h1>
        <p class="e-sub">一个专注代码生成、数学推理与文本创作的小参数模型。把问题交给我，我们开始吧。</p>
        <div class="e-slot" id="composerSlotCenter"></div>
        <div class="qp" id="qp"></div>
      </div>
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-dock" id="composerDock" style="display:none">
      <div id="composerSlotDock"></div>
      <div class="dock-hint">StarMoon-z1 可能会出错 · <kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</div>
    </div>
  </main>
</div>

<!-- 输入框模板 -->
<template id="composerTpl">
  <div class="composer">
    <div class="cbox">
      <textarea id="userInput" rows="1" placeholder="给 StarMoon-z1 发消息…"></textarea>
      <button class="send" id="sendBtn" title="发送"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</template>

<div class="toast" id="toast"><span class="tdot"></span><span id="toastMsg"></span></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const LS_KEY = 'starmoon-z1-convs';
const state = { convs: [], current: null, generating: false, abortCtrl: null, totalTokens: 0, totalTime: 0, health: null };
let composer, inputEl, sendBtn;
const thread = $('thread'), chatScroll = $('chatScroll');

/* ---------- marked ---------- */
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderCodeBlock(code, lang){
  const language = (lang||'text').trim().split(/\s+/)[0];
  let hl;
  try { hl = (window.hljs && hljs.getLanguage(language)) ? hljs.highlight(code,{language}).value : (window.hljs ? hljs.highlightAuto(code).value : escapeHtml(code)); }
  catch(e){ hl = escapeHtml(code); }
  return `<div class="codeblock"><div class="cb-head"><span class="cb-dots"><i></i><i></i><i></i></span><span class="cb-lang">${escapeHtml(language)}</span><button class="cb-copy" onclick="copyCode(this)">copy</button></div><pre><code class="hljs">${hl}</code></pre></div>`;
}
marked.use({ gfm:true, breaks:true, renderer:{ code(token){
  if (token && typeof token==='object') return renderCodeBlock(token.text, token.lang);
  return renderCodeBlock(token, arguments[1]);
}}});
window.copyCode = btn => { navigator.clipboard.writeText(btn.closest('.codeblock').querySelector('code').innerText).then(()=>toast('代码已复制')); };

/* ---------- Toast ---------- */
let toastT=null;
function toast(msg){ $('toastMsg').textContent=msg; $('toast').classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>$('toast').classList.remove('show'),2200); }

/* ---------- 服务状态 ---------- */
async function checkHealth(){
  try{
    const r=await fetch('/health'); const d=await r.json(); state.health=d;
    const name=(d.model||'').split(/[/\\]/).pop()||d.model;
    $('statusDot').className='pulse on'; $('modelName').textContent=name; $('backendBadge').textContent=d.backend;
    $('msSub').textContent='1.5B · '+d.backend;
    $('mpModel').textContent=name; $('mpBackend').textContent=d.backend;
    $('mpStatus').textContent='在线'; $('mpStatus').className='mp-v ok';
  }catch(e){
    state.health=null;
    $('statusDot').className='pulse off'; $('modelName').textContent='disconnected'; $('backendBadge').textContent='—';
    $('mpModel').textContent='—'; $('mpBackend').textContent='—';
    $('mpStatus').textContent='离线 · 请运行 starmoon-z1 serve'; $('mpStatus').className='mp-v warn';
  }
}
checkHealth(); setInterval(checkHealth,15000);

/* ---------- 会话存储 ---------- */
function loadConvs(){ try{ state.convs = JSON.parse(localStorage.getItem(LS_KEY)||'[]'); }catch(e){ state.convs=[]; } }
function saveConvs(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state.convs)); }catch(e){} }
function currentConv(){ return state.convs.find(c=>c.id===state.current) || null; }
function createConv(title){
  const c={ id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:title.slice(0,40), messages:[], createdAt:Date.now() };
  state.convs.unshift(c); state.current=c.id; saveConvs(); return c;
}

/* ---------- 会话列表渲染 ---------- */
function dayLabel(ts){
  const d=new Date(ts), n=new Date();
  const startToday=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  if(ts>=startToday) return '今天';
  if(ts>=startToday-86400000) return '昨天';
  if(ts>=startToday-7*86400000) return '最近 7 天';
  return '更早';
}
function renderConvList(){
  const el=$('convList');
  if(!state.convs.length){ el.innerHTML='<div class="conv-empty">暂无对话<br>开始你的第一次提问 →</div>'; return; }
  const groups={};
  state.convs.forEach(c=>{ const l=dayLabel(c.createdAt); (groups[l]=groups[l]||[]).push(c); });
  const order=['今天','昨天','最近 7 天','更早'];
  el.innerHTML = order.filter(l=>groups[l]).map(l =>
    `<div class="cg-label">${l}</div>` + groups[l].map(c =>
      `<div class="conv-item ${c.id===state.current?'active':''}" data-id="${c.id}"><span class="ci-title">${escapeHtml(c.title)}</span><button class="ci-del" data-del="${c.id}" title="删除">✕</button></div>`
    ).join('')
  ).join('');
  el.querySelectorAll('.conv-item').forEach(it=>it.addEventListener('click',e=>{
    if(e.target.dataset.del){ deleteConv(e.target.dataset.del); return; }
    selectConv(it.dataset.id);
  }));
}
function deleteConv(id){
  state.convs=state.convs.filter(c=>c.id!==id); saveConvs();
  if(state.current===id){ state.current=null; showEmpty(); }
  renderConvList(); toast('对话已删除');
}
function selectConv(id){
  const c=state.convs.find(x=>x.id===id); if(!c) return;
  state.current=id;
  $('emptyState').style.display='none';
  $('composerDock').style.display='block';
  $('composerSlotDock').appendChild(composer);
  thread.style.display='block';
  thread.innerHTML='';
  c.messages.forEach(m=> m.role==='user' ? addUserMsg(m.content,false) : addAssistantMsg(m.content,false));
  renderConvList(); scrollToBottom(true);
  if(window.innerWidth<=820){ $('sidebar').classList.remove('open'); $('overlay').classList.remove('show'); }
}
function showEmpty(){
  thread.innerHTML='';
  thread.style.display='none';
  $('emptyState').style.display='flex';
  $('composerDock').style.display='none';
  $('composerSlotCenter').appendChild(composer);
  renderConvList();
}

/* ---------- 消息渲染 ---------- */
function scrollToBottom(inst){
  requestAnimationFrame(()=>{ chatScroll.scrollTo({top:chatScroll.scrollHeight, behavior:inst?'auto':'smooth'}); });
}
function addUserMsg(text, anim=true){
  const el=document.createElement('div');
  el.className='u-row'; if(!anim) el.style.animation='none';
  el.innerHTML='<div class="u-bubble"></div>';
  el.querySelector('.u-bubble').textContent=text;
  thread.appendChild(el); scrollToBottom();
}
function addAssistantMsg(content, anim=true){
  const el=document.createElement('div');
  el.className='a-row'; if(!anim) el.style.animation='none';
  el.innerHTML=`<div class="a-ava">Z1</div><div class="a-body"><div class="a-content">${content!=null?marked.parse(content):'<span class="thinking"><i></i><i></i><i></i></span>'}</div><div class="a-actions"><button class="act" data-act="copy" title="复制"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button class="act" data-act="regen" title="重新生成"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button></div></div>`;
  el.querySelector('[data-act="copy"]').addEventListener('click',()=>{ navigator.clipboard.writeText(el.querySelector('.a-content').innerText).then(()=>toast('已复制到剪贴板')); });
  el.querySelector('[data-act="regen"]').addEventListener('click',regenerate);
  thread.appendChild(el); scrollToBottom();
  return el;
}

/* ---------- 发送 & SSE ---------- */
function updateSendState(){
  if(state.generating) return;
  sendBtn.classList.toggle('ready', inputEl.value.trim().length>0);
}
function autoResize(){ inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,200)+'px'; }
async function handleSend(){
  const text=inputEl.value.trim();
  if(!text||state.generating) return;
  inputEl.value=''; autoResize(); updateSendState();
  let conv=currentConv();
  if(!conv) conv=createConv(text);
  else if(!conv.messages.length) conv.title=text.slice(0,40);
  $('emptyState').style.display='none';
  $('composerDock').style.display='block';
  $('composerSlotDock').appendChild(composer);
  thread.style.display='block';
  conv.messages.push({role:'user',content:text});
  addUserMsg(text);
  renderConvList(); saveConvs();
  await generateReply();
}
async function generateReply(){
  const conv=currentConv(); if(!conv) return;
  const sys=$('systemPrompt').value.trim();
  const req=[]; if(sys) req.push({role:'system',content:sys});
  req.push(...conv.messages.slice(-20));

  state.generating=true;
  sendBtn.classList.remove('ready'); sendBtn.classList.add('stop');
  sendBtn.innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg>';
  sendBtn.title='停止生成';
  state.abortCtrl=new AbortController();

  const row=addAssistantMsg(null);
  row.classList.add('gen');
  const contentEl=row.querySelector('.a-content');
  let full='', scheduled=false;
  const paint=()=>{ scheduled=false; contentEl.innerHTML=marked.parse(full)+'<span class="cursor"></span>'; scrollToBottom(); };

  try{
    const resp=await fetch('/chat',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:req, stream:true,
        temperature:+$('temperature').value,
        top_p:+$('topP').value,
        top_k:+$('topK').value,
        repetition_penalty:+$('repP').value,
        max_new_tokens:+$('maxTokens').value
      }),
      signal:state.abortCtrl.signal,
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader(), dec=new TextDecoder();
    let buf='', meta=null;
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        const p=line.slice(6); if(p==='[DONE]') continue;
        try{ const d=JSON.parse(p);
          if(d.done){ meta=d; continue; }
          if(d.text){ full+=d.text; if(!scheduled){scheduled=true;requestAnimationFrame(paint);} }
        }catch(e){}
      }
    }
    if(meta){
      state.totalTokens+=meta.tokens||0; state.totalTime+=meta.time||0;
      $('statTokens').textContent=state.totalTokens.toLocaleString();
      $('statSpeed').textContent=state.totalTime>0?Math.round(state.totalTokens/state.totalTime):'—';
    }
  }catch(err){
    if(err.name==='AbortError') full+='\n\n*[已停止生成]*';
    else full=`**请求失败**: ${err.message}\n\n请确认服务已启动: \`starmoon-z1 serve --model <path>\``;
  }

  contentEl.innerHTML=marked.parse(full);
  row.classList.remove('gen');
  conv.messages.push({role:'assistant',content:full});
  saveConvs();
  state.generating=false; state.abortCtrl=null;
  sendBtn.classList.remove('stop');
  sendBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  sendBtn.title='发送'; updateSendState();
  scrollToBottom(); inputEl.focus();
}
function regenerate(){
  if(state.generating) return;
  const conv=currentConv(); if(!conv||!conv.messages.length) return;
  if(conv.messages[conv.messages.length-1].role==='assistant'){
    conv.messages.pop(); saveConvs();
    const rows=thread.querySelectorAll('.a-row');
    if(rows.length) rows[rows.length-1].remove();
  }
  generateReply();
}
function stopGeneration(){ if(state.abortCtrl) state.abortCtrl.abort(); }

/* ---------- 快捷指令 ---------- */
const PROMPTS=[
  ['c1','Code','用 Python 实现 LRU Cache，O(1) 复杂度并附单测','用 Python 实现一个 LRU Cache，要求 O(1) 时间复杂度，附带单元测试'],
  ['c2','Reasoning','100 人房间比例推理，一步步分析','一个房间里有100个人，99%是左撇子。要使左撇子比例降到98%，需要多少左撇子离开？请一步步推理'],
  ['c3','Knowledge','FlashAttention 为什么能省显存？','解释 Transformer 中 FlashAttention 的原理，为什么它能减少显存占用？'],
  ['c4','Creative','写一首深夜写代码的现代诗','写一首关于深夜写代码的现代诗，要有画面感'],
];
$('qp').innerHTML=PROMPTS.map(p=>`<span class="chip ${p[0]}" data-p="${escapeHtml(p[3])}"><span class="dot"></span>${escapeHtml(p[2])}</span>`).join('');
$('qp').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ inputEl.value=c.dataset.p; autoResize(); updateSendState(); handleSend(); }));

/* ---------- 初始化输入框 ---------- */
composer=$('composerTpl').content.firstElementChild.cloneNode(true);
inputEl=composer.querySelector('#userInput');
sendBtn=composer.querySelector('#sendBtn');
inputEl.addEventListener('input',()=>{ autoResize(); updateSendState(); });
inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();} });
sendBtn.addEventListener('click',()=>{ state.generating?stopGeneration():handleSend(); });

/* ---------- 侧边栏 / 弹层 ---------- */
$('newBtn').addEventListener('click',()=>{ state.current=null; showEmpty(); toast('已开启新对话'); inputEl.focus();
  if(window.innerWidth<=820){ $('sidebar').classList.remove('open'); $('overlay').classList.remove('show'); } });
$('collapseBtn').addEventListener('click',()=>$('app').classList.add('side-collapsed'));
$('menuBtn').addEventListener('click',()=>{
  if(window.innerWidth<=820){ $('sidebar').classList.add('open'); $('overlay').classList.add('show'); }
  else $('app').classList.remove('side-collapsed');
});
$('overlay').addEventListener('click',()=>{ $('sidebar').classList.remove('open'); $('overlay').classList.remove('show'); });
$('accHead').addEventListener('click',()=>{ $('accHead').classList.toggle('open'); $('accBody').classList.toggle('open'); });
$('modelSel').addEventListener('click',e=>{ e.stopPropagation(); $('modelPop').classList.toggle('show'); });
$('modelPop').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>$('modelPop').classList.remove('show'));

/* ---------- 滑杆 ---------- */
function paintRange(el){ el.style.setProperty('--fill',((el.value-el.min)/(el.max-el.min)*100)+'%'); }
['temperature','topP','topK','repP','maxTokens'].forEach(id=>{ const el=$(id); paintRange(el); el.addEventListener('input',()=>paintRange(el)); });
$('temperature').addEventListener('input',e=>$('tempVal').textContent=(+e.target.value).toFixed(2));
$('topP').addEventListener('input',e=>$('topPVal').textContent=(+e.target.value).toFixed(2));
$('topK').addEventListener('input',e=>$('topKVal').textContent=e.target.value);
$('repP').addEventListener('input',e=>$('repPVal').textContent=(+e.target.value).toFixed(2));
$('maxTokens').addEventListener('input',e=>$('maxTokVal').textContent=e.target.value);

/* ---------- 启动 ---------- */
loadConvs();
renderConvList();
showEmpty();
})();
</script>
</body>
</html>
